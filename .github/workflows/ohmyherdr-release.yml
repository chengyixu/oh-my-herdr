name: Release OhMyHerdr

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version from Cargo.toml (for example 0.9.6)
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  release-macos-arm64:
    runs-on: macos-latest
    env:
      OHMYHERDR_BUILD: "1"
      HERDR_BUILD_CHANNEL: ohmyherdr
      HERDR_BUILD_ID: ${{ inputs.version }}
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: "true"

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Verify product version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          test "$(printf '%s' "$version" | tr -cd '.')" = ".."
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "$version" = "$cargo_version"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt,clippy
          targets: aarch64-apple-darwin

      - name: Restore Homebrew Zig cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-zig-0.16-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            homebrew-zig-0.16-${{ runner.os }}-

      - name: Install build tools
        shell: bash
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja zig
          echo "$(brew --prefix zig)/bin" >> "$GITHUB_PATH"
          test "$("$(brew --prefix zig)/bin/zig" version)" = "0.16.0"

      - name: Install test tools
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: just,cargo-nextest

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Qualify source before publication
        shell: bash
        run: |
          set -euo pipefail
          env -u OHMYHERDR_BUILD -u HERDR_BUILD_CHANNEL -u HERDR_BUILD_ID NEXTEST_TEST_THREADS=4 just ci
          just docs-contract-test
          node --test npm/test/install.test.js

      - name: Build product artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out
          cargo build --release --locked --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/herdr ohmyherdr-macos-aarch64
          chmod +x ohmyherdr-macos-aarch64
          ./ohmyherdr-macos-aarch64 --version | grep -F "${{ inputs.version }}-ohmyherdr.${{ inputs.version }}"

      - name: Publish release and update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          tag="ohmyherdr-v${version}"
          asset="ohmyherdr-macos-aarch64"
          protocol="$(sed -n 's/pub const PROTOCOL_VERSION: u32 = \([0-9][0-9]*\);/\1/p' src/protocol/wire.rs)"
          endpoint_generation="$(sed -n 's/pub const ENDPOINT_PROTOCOL_GENERATION: u32 = \([0-9][0-9]*\);/\1/p' src/protocol/endpoint.rs)"
          cat > release-notes.md <<EOF
          ### Fixed
          - Live harness switching advertises every required client endpoint method and executes readiness waits through the shared async handler.
          - Saved profile editing remains advertised alongside prompt delivery and terminal reads.
          - Returning to a harness uses recorded exact-instance handoff history, preserving unrelated sibling conversations.
          - Context delivery validates the exact receiver before writing input. Profile-default returns and manually started original sessions reuse their recorded native session.
          - Failed history writes leave the source layout intact; the replacement focus and archive update are reconciled for connected clients.
          - Native confirmations and active turns block context delivery. Droid's folder-trust dialog is detected before any handoff prompt is submitted.
          - Clarified when the installed client is connected to an older server: Integrations now shows a runtime-upgrade notice, highlights the selected hook, and supports mouse-wheel and keyboard navigation on small terminals.
          - The legacy Integrations Enter key installs the selected available hook; the bulk installer remains on the i key.

          ### Changed
          - The pane Harness menu switches immediately into an activated CLI. The new CLI receives saved profile documents and a bounded terminal excerpt as a new conversation.
          - The source agent's original process and native session remain intact in a visibly labeled Previous tab. Returning to a recorded, still-running earlier harness reuses its native session and receives a bounded portable update.
          - The server verifies exact source and replacement identities before it archives the original pane and focuses the ready replacement. An unsuccessful switch leaves the original in place.
          - The new exact instance retains its own harness for revival, independent of the shared profile and sibling agents.

          ### Distribution
          - Apple Silicon macOS binary: ${asset}.
          - Product identity: ${version}-ohmyherdr.${version}.
          - Private protocol: ${protocol}; stable endpoint generation: ${endpoint_generation}.
          - Source commit: ${GITHUB_SHA}.

          ### Updating
          - Publishing this release does not install it or restart any existing runtime.
          - Run \`ohmyherdr update\` when ready, then follow the updater's runtime migration guidance.
          - Ohmyherdr updates use merged fork builds; raw upstream Herdr binaries do not replace the fork.
          EOF
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          version = os.environ["HERDR_BUILD_ID"]
          asset = "ohmyherdr-macos-aarch64"
          protocol = int(re.search(r"pub const PROTOCOL_VERSION: u32 = (\d+);", pathlib.Path("src/protocol/wire.rs").read_text()).group(1))
          generation = int(re.search(r"pub const ENDPOINT_PROTOCOL_GENERATION: u32 = (\d+);", pathlib.Path("src/protocol/endpoint.rs").read_text()).group(1))
          manifest = {
              "version": version,
              "protocol": protocol,
              "endpoint_generation": generation,
              "source_commit": os.environ["GITHUB_SHA"],
              "notes": pathlib.Path("release-notes.md").read_text(),
              "assets": {"macos-aarch64": {
                  "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/ohmyherdr-v{version}/{asset}",
                  "sha256": hashlib.sha256(pathlib.Path(asset).read_bytes()).hexdigest(),
              }},
          }
          pathlib.Path("ohmyherdr-latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          gh release create "$tag" "$asset" ohmyherdr-latest.json \
            --draft \
            --target "$GITHUB_SHA" \
            --title "OhMyHerdr v${version}" \
            --notes-file release-notes.md
          gh release edit "$tag" --draft=false --latest
